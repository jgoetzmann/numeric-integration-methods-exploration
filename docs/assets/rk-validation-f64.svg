<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="rk-validation-f64-title rk-validation-f64-desc"><title id="rk-validation-f64-title">Out-of-sample float64 error, champion against rk4</title><desc id="rk-validation-f64-desc">Dot plot, one row per out-of-sample problem, of float64 error on a log axis: the champion 11e898cb against rk4, each at the step count the 65,536-cycle budget gives it. 7 problems are plotted. The champion&#x27;s error is 1,992x to 420,975x that of rk4.</desc><style>svg{--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--surface:#fcfcfb;--text-1:#0b0b0b;--text-2:#52514e;--grid:#e4e3df;color:#0b0b0b;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.rk-bg{fill:#fcfcfb}.rk-s1{fill:#2a78d6}.rk-s2{fill:#eb6834}.rk-s3{fill:#1baf7a}.rk-l1{stroke:#2a78d6;fill:none}.rk-l2{stroke:#eb6834;fill:none}.rk-l3{stroke:#1baf7a;fill:none}.rk-grid,.rk-connector{stroke:#e4e3df}.rk-axis,.rk-ref{stroke:#52514e}.rk-muted{fill:#52514e}.rk-band{fill:#e4e3df}</style><rect class="rk-bg" x="0" y="0" width="720" height="332" fill="var(--surface)"/><rect class="rk-swatch rk-s1" x="372.4" y="7" width="10" height="10" rx="2" fill="var(--series-1)"/><text x="386.4" y="16" font-size="12" text-anchor="start" fill="currentColor">rk4 in float64</text><rect class="rk-swatch rk-s2" x="499.6" y="7" width="10" height="10" rx="2" fill="var(--series-2)"/><text x="513.6" y="16" font-size="12" text-anchor="start" fill="currentColor">champion 11e898cb in float64</text><line class="rk-grid" x1="227.57" y1="40" x2="227.57" y2="280" stroke="var(--grid)" stroke-width="1"/><text x="227.57" y="296" font-size="12" text-anchor="middle" class="rk-muted" fill="var(--text-2)">1e-13</text><line class="rk-grid" x1="295.63" y1="40" x2="295.63" y2="280" stroke="var(--grid)" stroke-width="1"/><text x="295.63" y="296" font-size="12" text-anchor="middle" class="rk-muted" fill="var(--text-2)">1e-12</text>