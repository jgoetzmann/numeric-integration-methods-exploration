<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="rk-frontier-title rk-frontier-desc"><title id="rk-frontier-title">Held-out error against cost per step, epoch 1</title><desc id="rk-frontier-desc">Scatter plot of held-out RMS error (log scale) against cycles per step for 8 classical methods and 16 discovered cell elites. The champion 11e898cb has the lowest error, 0.0286 at 22 cycles per step; midpoint, the best classical method, has 0.0844 at 11.</desc><style>svg{--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--surface:#fcfcfb;--text-1:#0b0b0b;--text-2:#52514e;--grid:#e4e3df;color:#0b0b0b;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.rk-bg{fill:#fcfcfb}.rk-s1{fill:#2a78d6}.rk-s2{fill:#eb6834}.rk-s3{fill:#1baf7a}.rk-l1{stroke:#2a78d6;fill:none}.rk-l2{stroke:#eb6834;fill:none}.rk-l3{stroke:#1baf7a;fill:none}.rk-grid,.rk-connector{stroke:#e4e3df}.rk-axis,.rk-ref{stroke:#52514e}.rk-muted{fill:#52514e}.rk-band{fill:#e4e3df}</style><rect class="rk-bg" x="0" y="0" width="720" height="390" fill="var(--surface)"/><rect class="rk-swatch rk-s1" x="392.8" y="7" width="10" height="10" rx="2" fill="var(--series-1)"/><text x="406.8" y="16" font-size="12" text-anchor="start" fill="currentColor">classical methods</text><rect class="rk-swatch rk-s2" x="540.4" y="7" width="10" height="10" rx="2" fill="var(--series-2)"/><text x="554.4" y="16" font-size="12" text-anchor="start" fill="currentColor">discovered cell elites</text><text x="8" y="38" font-size="12" text-anchor="start" fill="currentColor">held-out RMS error (log scale)</text><line class="rk-grid" x1="64" y1="338" x2="704" y2="338" stroke="var(--grid)" stroke-width="1"/><text x="56" y="342" font-size="12" text-anchor="end" class="rk-muted" fill="var(--text-2)">0.02</text><line class="rk-grid" x1="64" y1="256.59" x2="704" y2="256.59" stroke="var(--grid)" stroke-width="1"/><text x="56" y="260.59" font-size="12" text-